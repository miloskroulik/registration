services:
  registration_change_host.manager:
    class: Drupal\registration_change_host\RegistrationChangeHostManager
    arguments: ['@event_dispatcher', '@entity_type.manager', '@database', '@entity_field.manager', '@variation_cache.registration_change_host_possible_hosts']

  registration_change_host.logger:
    parent: logger.channel_base
    arguments: ['registration_change_host']

  cache.registration_change_host_possible_hosts:
    class: Drupal\Core\Cache\MemoryBackend
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [registration_change_host_possible_hosts]

  variation_cache.registration_change_host_possible_hosts:
    class: Drupal\Core\Cache\VariationCacheInterface
    factory: ['@variation_cache_factory', 'get']
    arguments: [registration_change_host_possible_hosts]
